<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helados Cremosos - Sistema de Inventario</title>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Iconos (Feather Icons vía CDN) -->
    <script src="https://unpkg.com/feather-icons"></script>

    <!--
        NOTA: @supabase/supabase-js ya NO se carga aquí con un <script> fijo.
        Se carga dinámicamente más abajo, probando varios CDN en orden,
        porque si el único <script> fijo fallaba (bloqueado, CDN caído,
        extensión del navegador, etc.) la app se quedaba en "modo local"
        sin avisar claramente, y por eso nunca se veía ninguna petición
        de red hacia Supabase.
    -->

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fcf9f2; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .flavor-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .flavor-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.3s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen text-gray-800">

    <div id="root"></div>

    <script>
        // ---------------------------------------------------------------
        // Carga dinámica y con reintento de la librería @supabase/supabase-js.
        // Si el primer CDN falla, prueba con un segundo. Expone una promesa
        // global (window.__supabaseLibReady) que el código de React espera
        // antes de intentar crear el cliente.
        // ---------------------------------------------------------------
        function loadScriptOnce(src) {
            return new Promise((resolve, reject) => {
                const existing = document.querySelector(`script[data-dynamic-src="${src}"]`);
                if (existing) { resolve(); return; }
                const s = document.createElement('script');
                s.src = src;
                s.dataset.dynamicSrc = src;
                s.onload = () => resolve();
                s.onerror = () => reject(new Error('No se pudo cargar el script: ' + src));
                document.head.appendChild(s);
            });
        }

        window.__loadSupabaseLib = async function () {
            if (window.supabase && typeof window.supabase.createClient === 'function') {
                return true;
            }
            const candidateUrls = [
                'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
                'https://unpkg.com/@supabase/supabase-js@2'
            ];
            for (const url of candidateUrls) {
                try {
                    console.log('[Supabase] Intentando cargar librería desde:', url);
                    await loadScriptOnce(url);
                    if (window.supabase && typeof window.supabase.createClient === 'function') {
                        console.log('[Supabase] Librería cargada correctamente desde:', url);
                        return true;
                    }
                } catch (e) {
                    console.warn('[Supabase] Falló ese CDN, probando el siguiente...', e.message);
                }
            }
            console.error('[Supabase] No se pudo cargar la librería desde ningún CDN. Revisa tu conexión, bloqueadores de anuncios/extensiones, o el firewall de tu red.');
            return false;
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const FLAVOR_CONFIG = {
            oreo: { name: 'Oreo', color: '#f3f4f6', shadow: '#e5e7eb', text: 'text-gray-700' },
            menta: { name: 'Menta', color: '#bbf7d0', shadow: '#86efac', text: 'text-green-800' },
            vainilla: { name: 'Vainilla', color: '#fef3c7', shadow: '#fde68a', text: 'text-yellow-800' },
            chocolate: { name: 'Chocolate', color: '#8b5cf6', shadow: '#7c3aed', text: 'text-purple-900', overrideColor: '#713f12', overrideShadow: '#451a03' }
        };

        const DEFAULT_STATE = {
            inventory: {
                oreo: { small: 9, large: 2 },
                menta: { small: 12, large: 0 },
                vainilla: { small: 0, large: 1 },
                chocolate: { small: 0, large: 0 }
            },
            flavorSales: {
                oreo: { small: 0, large: 0 },
                menta: { small: 0, large: 0 },
                vainilla: { small: 0, large: 0 },
                chocolate: { small: 0, large: 0 }
            }
        };

        const IceCreamCup = ({ flavorKey }) => {
            const config = FLAVOR_CONFIG[flavorKey];
            const mainColor = config.overrideColor || config.color;
            const shadowColor = config.overrideShadow || config.shadow;

            return (
                <svg viewBox="0 0 100 120" className="w-24 h-24 mx-auto mb-4 drop-shadow-lg" xmlns="http://www.w3.org/2000/svg">
                    <ellipse cx="50" cy="110" rx="30" ry="8" fill="rgba(0,0,0,0.1)" />
                    <path d="M 25 50 L 35 110 C 35 115 65 115 65 110 L 75 50 Z" fill="#e5e7eb" />
                    <path d="M 25 50 L 35 110 C 35 115 65 115 65 110 L 75 50 Z" fill="url(#metallicGradient)" opacity="0.6"/>
                    <ellipse cx="50" cy="50" rx="25" ry="10" fill="#d1d5db" />

                    <path d="M 23 45 C 23 25 77 25 77 45 C 77 55 23 55 23 45 Z" fill={mainColor} />
                    <ellipse cx="50" cy="45" rx="27" ry="12" fill={mainColor} />
                    <ellipse cx="50" cy="42" rx="24" ry="10" fill={shadowColor} opacity="0.3" />

                    {flavorKey === 'oreo' && (
                        <g fill="#374151">
                            <circle cx="35" cy="40" r="1.5" />
                            <circle cx="45" cy="35" r="2" />
                            <circle cx="60" cy="38" r="1.5" />
                            <circle cx="50" cy="48" r="2.5" />
                            <circle cx="30" cy="46" r="1" />
                            <circle cx="65" cy="45" r="1.8" />
                        </g>
                    )}

                    <path d="M 46 15 L 47 45 L 53 45 L 54 15 C 54 10 46 10 46 15 Z" fill="#d4a373" />
                    <path d="M 50 15 L 50 45" stroke="#bc6c25" strokeWidth="1" opacity="0.5" />

                    <defs>
                        <linearGradient id="metallicGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stopColor="#ffffff" stopOpacity="0.8" />
                            <stop offset="50%" stopColor="#9ca3af" stopOpacity="0.1" />
                            <stop offset="100%" stopColor="#4b5563" stopOpacity="0.5" />
                        </linearGradient>
                    </defs>
                </svg>
            );
        };

        const SUPABASE_URL = 'https://wuegeyaxaernahzpmujc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1ZWdleWF4YWVybmFoenBtdWpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MDgyNjIsImV4cCI6MjEwMjM4NDI2Mn0.Od5QcVZZDz3PzUrEbXKhHiWl9OH4qRvLn4vA5YF914c';

        // Estados posibles de la conexión con la base de datos
        // 'checking' | 'connected' | 'offline' | 'error'
        const App = () => {
            const [storeState, setStoreState] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [authError, setAuthError] = useState(false);
            const [toastMessage, setToastMessage] = useState(null);
            const [hasUnsavedChanges, setHasUnsavedChanges] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            const [dbStatus, setDbStatus] = useState('checking'); // checking | connected | offline | error
            const [dbStatusDetail, setDbStatusDetail] = useState('');

            const supabaseRef = useRef(null);
            const hasUnsavedChangesRef = useRef(false);
            useEffect(() => { hasUnsavedChangesRef.current = hasUnsavedChanges; }, [hasUnsavedChanges]);

            const PRICE_SMALL = 0.50;
            const PRICE_LARGE = 0.75;

            useEffect(() => {
                if (window.feather) window.feather.replace();
            }, [storeState, isAdmin, showAuthModal, toastMessage, hasUnsavedChanges, dbStatus]);

            useEffect(() => {
                const handleBeforeUnload = (e) => {
                    if (hasUnsavedChangesRef.current) {
                        e.preventDefault();
                        e.returnValue = '';
                        return '';
                    }
                };
                window.addEventListener('beforeunload', handleBeforeUnload);
                return () => window.removeEventListener('beforeunload', handleBeforeUnload);
            }, []);

            const showToast = (message, isError = false) => {
                setToastMessage({ text: message, isError });
                setTimeout(() => setToastMessage(null), 3500);
            };

            const connectAndLoad = async () => {
                setDbStatus('checking');
                setDbStatusDetail('');

                const libLoaded = await window.__loadSupabaseLib();
                if (!libLoaded) {
                    setDbStatus('offline');
                    setDbStatusDetail('No se pudo cargar la librería de Supabase (@supabase/supabase-js) desde ningún CDN. Revisa tu conexión a internet, o si algún bloqueador de anuncios/extensión está bloqueando cdn.jsdelivr.net o unpkg.com.');
                    setStoreState(DEFAULT_STATE);
                    return;
                }

                let client;
                try {
                    client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                        auth: { persistSession: false, autoRefreshToken: false }
                    });
                } catch (e) {
                    console.error('[Supabase] Error creando el cliente:', e);
                    setDbStatus('error');
                    setDbStatusDetail('Error creando el cliente de Supabase: ' + e.message);
                    setStoreState(DEFAULT_STATE);
                    return;
                }

                supabaseRef.current = client;

                try {
                    console.log('[Supabase] Consultando fila id=1 en store_state...');
                    const { data, error } = await client
                        .from('store_state')
                        .select('data')
                        .eq('id', 1)
                        .maybeSingle();

                    if (error) {
                        console.error('[Supabase] Error en SELECT:', error);
                        throw error;
                    }

                    if (data && data.data) {
                        console.log('[Supabase] Fila encontrada, cargando estado guardado.');
                        setStoreState(data.data);
                    } else {
                        console.log('[Supabase] No existe la fila id=1 todavía, creándola con el estado por defecto...');
                        const { data: insertData, error: insertError } = await client
                            .from('store_state')
                            .upsert([{ id: 1, data: DEFAULT_STATE }])
                            .select();

                        if (insertError) {
                            console.error('[Supabase] Error creando la fila inicial:', insertError);
                            throw insertError;
                        }
                        if (!insertData || insertData.length === 0) {
                            throw new Error('El insert no devolvió ninguna fila. Probablemente faltan permisos (GRANT) para el rol anon sobre la tabla store_state.');
                        }
                        setStoreState(DEFAULT_STATE);
                    }

                    setDbStatus('connected');
                    setDbStatusDetail('');

                    // Suscripción en tiempo real
                    const subscription = client
                        .channel('public:store_state')
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'store_state', filter: 'id=eq.1' }, payload => {
                            if (hasUnsavedChangesRef.current) {
                                console.warn('Se recibió una actualización remota pero hay cambios locales sin guardar; se ignora para no perder tus cambios.');
                                return;
                            }
                            if (payload.new && payload.new.data) {
                                setStoreState(payload.new.data);
                            }
                        })
                        .subscribe((status) => {
                            console.log('[Supabase] Estado del canal realtime:', status);
                        });

                    window.__supabaseSubscription = subscription;

                } catch (e) {
                    console.error('[Supabase] Error conectando / cargando datos:', e);
                    setDbStatus('error');
                    setDbStatusDetail(
                        (e.message || 'Error desconocido') +
                        (e.code ? ` (código: ${e.code})` : '') +
                        (e.hint ? ` — sugerencia: ${e.hint}` : '')
                    );
                    setStoreState(prev => prev || DEFAULT_STATE);
                }
            };

            useEffect(() => {
                connectAndLoad();
                return () => {
                    if (supabaseRef.current && window.__supabaseSubscription) {
                        supabaseRef.current.removeChannel(window.__supabaseSubscription);
                    }
                };
            }, []);

            const handleManualSave = async () => {
                const client = supabaseRef.current;
                if (!client || !storeState) {
                    showToast('No hay conexión con Supabase, no se puede guardar.', true);
                    return;
                }
                setIsSaving(true);
                try {
                    const { data, error } = await client
                        .from('store_state')
                        .upsert({ id: 1, data: storeState })
                        .select();

                    if (error) throw error;

                    if (!data || data.length === 0) {
                        showToast('Supabase no confirmó el guardado. Revisa los permisos (GRANT) de la tabla store_state para el rol anon.', true);
                        return;
                    }

                    setHasUnsavedChanges(false);
                    showToast('¡Datos guardados y actualizados en Supabase!');
                } catch (e) {
                    console.error('Error al guardar:', e);
                    showToast(`Error al guardar en Supabase: ${e.message || 'ver consola'}`, true);
                } finally {
                    setIsSaving(false);
                }
            };

            const handleSell = (flavorKey, size) => {
                if (!storeState || storeState.inventory[flavorKey][size] <= 0) {
                    showToast("No hay stock suficiente", true);
                    return;
                }
                const currentFlavorSales = storeState.flavorSales || DEFAULT_STATE.flavorSales;
                const newState = {
                    ...storeState,
                    inventory: {
                        ...storeState.inventory,
                        [flavorKey]: { ...storeState.inventory[flavorKey], [size]: storeState.inventory[flavorKey][size] - 1 }
                    },
                    flavorSales: {
                        ...currentFlavorSales,
                        [flavorKey]: { ...currentFlavorSales[flavorKey], [size]: (currentFlavorSales[flavorKey][size] || 0) + 1 }
                    }
                };
                setStoreState(newState);
                setHasUnsavedChanges(true);
                showToast(`Vendido: 1 ${FLAVOR_CONFIG[flavorKey].name} (${size === 'small' ? 'Pequeño' : 'Grande'}) — recuerda tocar "Guardar en la Nube"`);
            };

            const handleAdjustStock = (flavorKey, size, delta) => {
                if (!storeState) return;
                const currentAmount = storeState.inventory[flavorKey][size];
                if (currentAmount + delta < 0) return;

                const currentFlavorSales = storeState.flavorSales || DEFAULT_STATE.flavorSales;
                let newFlavorSales = JSON.parse(JSON.stringify(currentFlavorSales));
                if (delta < 0) {
                    if ((newFlavorSales[flavorKey][size] || 0) > 0) newFlavorSales[flavorKey][size] -= 1;
                } else if (delta > 0) {
                    newFlavorSales[flavorKey][size] = (newFlavorSales[flavorKey][size] || 0) + 1;
                }

                const newState = {
                    ...storeState,
                    inventory: { ...storeState.inventory, [flavorKey]: { ...storeState.inventory[flavorKey], [size]: currentAmount + delta } },
                    flavorSales: newFlavorSales
                };
                setStoreState(newState);
                setHasUnsavedChanges(true);
                showToast(`Inventario ajustado (${delta > 0 ? '+' : ''}${delta}) — recuerda tocar "Guardar en la Nube"`);
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (passwordInput === 'helado2026') {
                    setIsAdmin(true);
                    setShowAuthModal(false);
                    setPasswordInput('');
                    setAuthError(false);
                    showToast("Modo administrador activado");
                } else {
                    setAuthError(true);
                }
            };

            const handleLogout = () => {
                if (hasUnsavedChanges) {
                    const confirmLeave = window.confirm("Tienes cambios sin guardar. Si cierras sesión ahora se perderán al recargar la página. ¿Salir de todas formas?");
                    if (!confirmLeave) return;
                }
                setIsAdmin(false);
                showToast("Sesión cerrada");
            };

            const { totalEarnings, totalItemsSold, flavorBreakdown } = useMemo(() => {
                if (!storeState || !storeState.flavorSales) return { totalEarnings: 0, totalItemsSold: 0, flavorBreakdown: {} };
                let earnings = 0, sold = 0;
                const breakdown = {};
                Object.keys(FLAVOR_CONFIG).forEach(key => {
                    const smallSold = storeState.flavorSales[key]?.small || 0;
                    const largeSold = storeState.flavorSales[key]?.large || 0;
                    const subtotal = (smallSold * PRICE_SMALL) + (largeSold * PRICE_LARGE);
                    breakdown[key] = { small: smallSold, large: largeSold, subtotal, totalCount: smallSold + largeSold };
                    sold += smallSold + largeSold;
                    earnings += subtotal;
                });
                return { totalEarnings: earnings, totalItemsSold: sold, flavorBreakdown: breakdown };
            }, [storeState]);

            if (!storeState) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-purple-50">
                        <div className="w-16 h-16 border-4 border-purple-400 border-t-purple-600 rounded-full animate-spin mb-4"></div>
                        <h2 className="text-xl font-bold text-purple-800">Cargando...</h2>
                    </div>
                );
            }

            const statusBanner = {
                checking: { color: 'bg-blue-100 border-blue-300 text-blue-800', icon: 'loader', text: 'Conectando con Supabase...' },
                connected: { color: 'bg-green-100 border-green-300 text-green-800', icon: 'check-circle', text: 'Conectado a Supabase' },
                offline: { color: 'bg-red-100 border-red-300 text-red-800', icon: 'wifi-off', text: 'Sin conexión a Supabase — trabajando en modo local (nada se guarda)' },
                error: { color: 'bg-red-100 border-red-300 text-red-800', icon: 'alert-triangle', text: 'Error conectando a Supabase — trabajando en modo local' }
            }[dbStatus];

            return (
                <div className="pb-20">
                    <header className="bg-gradient-to-r from-purple-600 to-indigo-600 text-white p-4 shadow-md sticky top-0 z-10">
                        <div className="max-w-4xl mx-auto flex justify-between items-center">
                            <div>
                                <h1 className="text-2xl font-black tracking-tight" style={{fontFamily: "'Fredoka One', cursive, sans-serif"}}>
                                    HELADOS CREMOSOS
                                </h1>
                                <p className="text-purple-200 text-sm opacity-90 font-medium">
                                    {isAdmin ? "Panel de Administración y Ventas" : "Inventario General (Solo Visualización)"}
                                </p>
                            </div>
                            <button
                                onClick={() => isAdmin ? handleLogout() : setShowAuthModal(true)}
                                className="p-2 bg-white/20 hover:bg-white/30 rounded-full transition-colors backdrop-blur-sm"
                                title={isAdmin ? "Cerrar sesión" : "Administrar"}
                            >
                                <i data-feather={isAdmin ? "log-out" : "lock"} className="w-5 h-5"></i>
                            </button>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto p-4 mt-4">

                        {/* Banner de estado de conexión: siempre visible, no desaparece solo */}
                        <div className={`mb-4 p-3 rounded-xl border flex items-start gap-3 ${statusBanner.color}`}>
                            <i data-feather={statusBanner.icon} className={`w-5 h-5 mt-0.5 flex-shrink-0 ${dbStatus === 'checking' ? 'animate-spin' : ''}`}></i>
                            <div className="flex-1">
                                <p className="font-bold text-sm">{statusBanner.text}</p>
                                {dbStatusDetail && <p className="text-xs mt-1 opacity-90">{dbStatusDetail}</p>}
                            </div>
                            {(dbStatus === 'offline' || dbStatus === 'error') && (
                                <button
                                    onClick={connectAndLoad}
                                    className="text-xs font-bold bg-white/70 hover:bg-white px-3 py-1.5 rounded-lg flex-shrink-0"
                                >
                                    Reintentar
                                </button>
                            )}
                        </div>

                        {isAdmin && (
                            <div className="space-y-6 mb-8">
                                <div className={`flex justify-between items-center p-4 rounded-2xl border shadow-sm transition-colors ${hasUnsavedChanges ? 'bg-amber-50 border-amber-300' : 'bg-purple-50 border-purple-200'}`}>
                                    <div>
                                        <h3 className="font-bold text-purple-900 text-lg flex items-center gap-2">
                                            Panel de Sincronización
                                            {hasUnsavedChanges && (
                                                <span className="inline-flex items-center gap-1 text-xs font-bold text-amber-700 bg-amber-200 px-2 py-0.5 rounded-full animate-pulse">
                                                    <i data-feather="alert-triangle" className="w-3 h-3"></i>
                                                    Cambios sin guardar
                                                </span>
                                            )}
                                        </h3>
                                        <p className="text-xs text-purple-600">Guarda tus ventas y cambios manualmente en Supabase.</p>
                                    </div>
                                    <button
                                        onClick={handleManualSave}
                                        disabled={isSaving || dbStatus !== 'connected'}
                                        className={`px-5 py-2.5 text-white font-bold rounded-xl shadow-md flex items-center gap-2 transition-all active:scale-95 ${
                                            (isSaving || dbStatus !== 'connected') ? 'bg-gray-400 cursor-not-allowed' : hasUnsavedChanges ? 'bg-amber-600 hover:bg-amber-700' : 'bg-green-600 hover:bg-green-700'
                                        }`}
                                    >
                                        <i data-feather={isSaving ? "loader" : "cloud"} className="w-4 h-4"></i>
                                        {isSaving ? 'Guardando...' : 'Guardar en la Nube'}
                                    </button>
                                </div>

                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-purple-100 flex items-center gap-4">
                                        <div className="bg-green-100 p-3 rounded-xl text-green-600">
                                            <i data-feather="dollar-sign"></i>
                                        </div>
                                        <div>
                                            <p className="text-sm text-gray-500 font-medium">Ganancias Totales</p>
                                            <p className="text-2xl font-bold text-gray-800">${totalEarnings.toFixed(2)}</p>
                                        </div>
                                    </div>
                                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-purple-100 flex items-center gap-4">
                                        <div className="bg-blue-100 p-3 rounded-xl text-blue-600">
                                            <i data-feather="shopping-cart"></i>
                                        </div>
                                        <div>
                                            <p className="text-sm text-gray-500 font-medium">Helados Vendidos</p>
                                            <p className="text-2xl font-bold text-gray-800">{totalItemsSold} unid.</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-3xl p-6 shadow-sm border border-purple-100">
                                    <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                                        <i data-feather="bar-chart-2" className="text-purple-600"></i>
                                        Detalle Detallado de Ventas e Ingresos por Sabor
                                    </h3>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="border-b border-gray-100 text-xs text-gray-400 uppercase">
                                                    <th className="py-2 px-3">Sabor</th>
                                                    <th className="py-2 px-3 text-center">Pequeños ($0.50)</th>
                                                    <th className="py-2 px-3 text-center">Grandes ($0.75)</th>
                                                    <th className="py-2 px-3 text-right">Subtotal</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-50 text-sm">
                                                {Object.entries(FLAVOR_CONFIG).map(([key, config]) => {
                                                    const stats = flavorBreakdown[key] || { small: 0, large: 0, subtotal: 0 };
                                                    return (
                                                        <tr key={key} className="hover:bg-purple-50/50">
                                                            <td className="py-3 px-3 font-bold text-gray-700">{config.name}</td>
                                                            <td className="py-3 px-3 text-center font-medium text-gray-600">{stats.small}</td>
                                                            <td className="py-3 px-3 text-center font-medium text-gray-600">{stats.large}</td>
                                                            <td className="py-3 px-3 text-right font-bold text-purple-600">${stats.subtotal.toFixed(2)}</td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                            {Object.entries(FLAVOR_CONFIG).map(([key, config]) => (
                                <div key={key} className="glass-panel flavor-card rounded-3xl p-6 border border-gray-100 relative overflow-hidden">
                                    <div className="absolute -top-10 -right-10 w-32 h-32 rounded-full opacity-20" style={{backgroundColor: config.color}}></div>

                                    <IceCreamCup flavorKey={key} />

                                    <h3 className={`text-2xl font-black text-center mb-4 ${config.text}`}>{config.name}</h3>

                                    <div className="space-y-4 relative z-10">
                                        <div className="bg-gray-50 rounded-2xl p-3 flex justify-between items-center border border-gray-100 shadow-sm">
                                            <div>
                                                <span className="font-bold text-gray-700 block">Pequeño</span>
                                                <span className="text-sm text-purple-600 font-bold bg-purple-100 px-2 py-0.5 rounded-full">${PRICE_SMALL.toFixed(2)}</span>
                                            </div>

                                            {isAdmin ? (
                                                <div className="flex items-center gap-2">
                                                    <div className="flex items-center gap-1 bg-white px-2 py-1 rounded-xl shadow-inner border border-gray-200">
                                                        <button onClick={() => handleAdjustStock(key, 'small', -1)} className="w-8 h-8 flex items-center justify-center rounded-lg bg-red-100 text-red-600 font-bold text-lg">-</button>
                                                        <span className="w-6 text-center font-bold text-xl">{storeState.inventory[key].small}</span>
                                                        <button onClick={() => handleAdjustStock(key, 'small', 1)} className="w-8 h-8 flex items-center justify-center rounded-lg bg-green-100 text-green-600 font-bold text-lg">+</button>
                                                    </div>
                                                    <button
                                                        onClick={() => handleSell(key, 'small')}
                                                        disabled={storeState.inventory[key].small <= 0}
                                                        className={`px-3 py-2 rounded-xl font-bold text-white text-sm shadow-md transition-all ${storeState.inventory[key].small > 0 ? 'bg-purple-600 hover:bg-purple-700 active:scale-95' : 'bg-gray-300 cursor-not-allowed'}`}
                                                    >
                                                        Vender
                                                    </button>
                                                </div>
                                            ) : (
                                                <div className="text-center bg-white px-4 py-2 rounded-xl shadow-sm border border-gray-100">
                                                    <span className="block text-2xl font-black text-gray-800 leading-none">{storeState.inventory[key].small}</span>
                                                    <span className="text-xs text-gray-500 uppercase tracking-wider font-semibold">Stock</span>
                                                </div>
                                            )}
                                        </div>

                                        <div className="bg-gray-50 rounded-2xl p-3 flex justify-between items-center border border-gray-100 shadow-sm">
                                            <div>
                                                <span className="font-bold text-gray-700 block">Grande</span>
                                                <span className="text-sm text-purple-600 font-bold bg-purple-100 px-2 py-0.5 rounded-full">${PRICE_LARGE.toFixed(2)}</span>
                                            </div>

                                            {isAdmin ? (
                                                <div className="flex items-center gap-2">
                                                    <div className="flex items-center gap-1 bg-white px-2 py-1 rounded-xl shadow-inner border border-gray-200">
                                                        <button onClick={() => handleAdjustStock(key, 'large', -1)} className="w-8 h-8 flex items-center justify-center rounded-lg bg-red-100 text-red-600 font-bold text-lg">-</button>
                                                        <span className="w-6 text-center font-bold text-xl">{storeState.inventory[key].large}</span>
                                                        <button onClick={() => handleAdjustStock(key, 'large', 1)} className="w-8 h-8 flex items-center justify-center rounded-lg bg-green-100 text-green-600 font-bold text-lg">+</button>
                                                    </div>
                                                    <button
                                                        onClick={() => handleSell(key, 'large')}
                                                        disabled={storeState.inventory[key].large <= 0}
                                                        className={`px-3 py-2 rounded-xl font-bold text-white text-sm shadow-md transition-all ${storeState.inventory[key].large > 0 ? 'bg-purple-600 hover:bg-purple-700 active:scale-95' : 'bg-gray-300 cursor-not-allowed'}`}
                                                    >
                                                        Vender
                                                    </button>
                                                </div>
                                            ) : (
                                                <div className="text-center bg-white px-4 py-2 rounded-xl shadow-sm border border-gray-100">
                                                    <span className="block text-2xl font-black text-gray-800 leading-none">{storeState.inventory[key].large}</span>
                                                    <span className="text-xs text-gray-500 uppercase tracking-wider font-semibold">Stock</span>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    {showAuthModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl animate-fade-in-up">
                                <div className="text-center mb-6">
                                    <div className="w-16 h-16 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center mx-auto mb-3">
                                        <i data-feather="lock" className="w-8 h-8"></i>
                                    </div>
                                    <h2 className="text-2xl font-bold text-gray-800">Acceso Admin</h2>
                                    <p className="text-gray-500 text-sm mt-1">Ingresa la contraseña para gestionar ventas e inventario.</p>
                                </div>

                                <form onSubmit={handleLogin}>
                                    <div className="mb-4">
                                        <input
                                            type="password"
                                            placeholder="Contraseña..."
                                            value={passwordInput}
                                            onChange={(e) => { setPasswordInput(e.target.value); setAuthError(false); }}
                                            className={`w-full p-4 rounded-xl border-2 text-center text-lg font-bold tracking-widest focus:outline-none transition-colors ${authError ? 'border-red-500 bg-red-50' : 'border-gray-200 focus:border-purple-500'}`}
                                            autoFocus
                                        />
                                        {authError && <p className="text-red-500 text-sm text-center mt-2 font-medium">Contraseña incorrecta</p>}
                                    </div>

                                    <div className="flex gap-3 mt-6">
                                        <button type="button" onClick={() => setShowAuthModal(false)} className="flex-1 py-3 px-4 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl transition-colors">
                                            Cancelar
                                        </button>
                                        <button type="submit" className="flex-1 py-3 px-4 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl shadow-md transition-colors">
                                            Entrar
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {toastMessage && (
                        <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-50">
                            <div className={`px-6 py-3 rounded-full shadow-xl flex items-center gap-3 text-white font-medium ${toastMessage.isError ? 'bg-red-500' : 'bg-gray-800'}`}>
                                <i data-feather={toastMessage.isError ? "alert-circle" : "check-circle"} className="w-5 h-5"></i>
                                {toastMessage.text}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
